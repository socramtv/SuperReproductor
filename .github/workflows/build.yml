name: Build APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      # TDLib (Telegram con tu cuenta): si ya se compiló con el workflow
      # "Build TDLib", se restaura aquí; si no, la app compila sin esa función.
      - name: Restore TDLib
        uses: actions/cache/restore@v4
        with:
          path: app/tdlib
          key: tdlib-android-none
          restore-keys: |
            tdlib-android-
      - name: Build debug APK
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: super-reproductor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
